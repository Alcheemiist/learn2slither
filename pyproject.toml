[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learn2slither"
version = "0.1.0"
description = "Snake RL project – Learn2Slither"
authors = [
  { name = "Elmahdi Elaazmi", email = "you@example.com" }
]
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pygame",
  "pydantic",
]

[tool.setuptools.packages.find]
include = ["snake_rl*"]

[project.optional-dependencies]
dev = [
  "pytest",
  "flake8",
  "pre-commit"]